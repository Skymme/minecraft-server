services:
  mc:
    # Tag java21 : Minecraft 1.21.1 exige Java 21, image multi-arch (amd64 + arm64)
    image: itzg/minecraft-server:java21
    container_name: mc-atm10sky
    tty: true
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: AUTO_CURSEFORGE
      CF_SLUG: all-the-mods-10-sky
      # Épingler une version du pack pour que serveur et clients restent identiques
      CF_FILENAME_MATCHER: ${MODPACK_VERSION:-2.0.6}
      # CF_API_KEY est optionnel : une clé est intégrée aux images Java 17+
      CF_API_KEY: ${CF_API_KEY:-}
      # Mods ajoutés par-dessus le pack (les dépendances ne sont PAS résolues automatiquement)
      CURSEFORGE_FILES: |
        minecolonies
        structurize
        blockui
        domum-ornamentum
        multi-piston
        towntalk
      CF_FORCE_SYNCHRONIZE: "true"

      MEMORY: ${MEMORY:-12G}
      USE_AIKAR_FLAGS: "true"

      MOTD: "ATM10 To the Sky + MineColonies"
      DIFFICULTY: normal
      MAX_PLAYERS: 4
      VIEW_DISTANCE: 8
      SIMULATION_DISTANCE: 6
      ALLOW_FLIGHT: "TRUE"
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      WHITELIST: ${WHITELIST:-}
      OPS: ${OPS:-}

      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?RCON_PASSWORD doit être défini dans .env}
    volumes:
      - ./data:/data
    networks:
      mcnet:
        # IP fixe : c'est l'adresse locale à renseigner dans le tunnel playit.gg
        ipv4_address: 172.30.0.10

  # Tunnel playit.gg pour héberger depuis un PC perso sans ouvrir de port.
  # Activé seulement avec : docker compose --profile playit up -d
  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.16
    container_name: mc-atm10sky-playit
    profiles: ["playit"]
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      SECRET_KEY: ${PLAYIT_SECRET_KEY:-}
    networks:
      - mcnet

  backups:
    image: itzg/mc-backup
    container_name: mc-atm10sky-backup
    restart: unless-stopped
    depends_on:
      - mc
    environment:
      RCON_HOST: mc
      RCON_PASSWORD: ${RCON_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-6h}
      PRUNE_BACKUPS_DAYS: ${PRUNE_BACKUPS_DAYS:-7}
      INITIAL_DELAY: 10m
    volumes:
      - ./data:/data:ro
      - ./backups:/backups
    networks:
      - mcnet

networks:
  mcnet:
    ipam:
      config:
        - subnet: 172.30.0.0/24
